[project]
name = "ts-local"
version = "0.2.0"
description = "Local-first Tradovate trade copier and journal for personal use."
requires-python = ">=3.12"
dependencies = [
  "cryptography>=43.0.0,<45",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "websockets>=13,<16",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
ui = ["PySide6>=6.7,<7"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
